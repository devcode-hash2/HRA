<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#793576">
  <title>Legajos | Hospital Regional de Ayacucho</title>
  <style>
    :root {
      color-scheme: light;
      --purple: #793576;
      --purple-dark: #603576;
      --purple-soft: #faf7fc;
      --ink: #24344a;
      --text: #34445a;
      --muted: #64748b;
      --line: #d1d5db;
      --surface: #fff;
      --canvas: #f3f7fc;
      --green: #15803d;
      --green-bg: #dcfce7;
      --amber: #a16207;
      --amber-bg: #fef3c7;
      --blue: #1e40af;
      --blue-bg: #eff6ff;
      font-family: "Open Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden; background: var(--canvas); color: var(--text); font-size: 20px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #c084fc; outline-offset: 2px;
    }
    .shell { position: relative; width: 100%; max-width: none; min-height: 100vh; margin: 0; overflow: clip; padding: 78px 0 0 256px; border: 0; border-radius: 0; background: #fff; box-shadow: none; }
    .shell.collapsed { padding-left: 0; }
    .topbar {
      position: fixed; z-index: 20; inset: 0 0 auto; height: 64px; display: flex;
      align-items: center; border-radius: 0; background: var(--purple); color: white; box-shadow: 0 4px 9px #0002;
    }
    .brand {
      width: 256px; height: 64px; flex: 0 0 256px; display: flex; align-items: center;
      justify-content: center; padding: 0 10px; color: #333; background: #f3f4f6;
      overflow: hidden;
    }
    .brand-logo { display: block; width: 100%; max-width: 128px; max-height: 48px; object-fit: contain; }
    .collapsed .brand { width: 0; flex-basis: 0; padding: 0; visibility: hidden; }
    .top-title { display: flex; align-items: center; gap: 16px; padding-left: 20px; font-size: 16px; font-weight: 600; white-space: nowrap; }
    .hamburger { width: 40px; height: 40px; border: 0; border-radius: 5px; background: transparent; color: inherit; }
    .hamburger:hover, .bell:hover { background: #ffffff20; }
    .hamburger svg { width: 28px; height: 28px; fill: currentColor; vertical-align: middle; }
    .top-user { display: flex; align-items: center; gap: 10px; margin-left: auto; padding: 0 24px; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .top-user small { display: block; margin-top: 3px; font-size: 12px; font-weight: 400; }
    .bell { display: inline-flex; border-radius: 50%; padding: 8px; color: white; }
    .bell { margin-right: 28px; }
    .bell svg { width: 20px; height: 20px; fill: currentColor; }
    .avatar { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: #f3f4f6; color: #cbd0d5; }
    .avatar svg { width: 100%; height: 100%; fill: currentColor; stroke: #fff; stroke-width: 1.2; }
    .sidebar {
      position: fixed; z-index: 10; inset: 64px auto 0 0; width: 256px; padding: 0;
      border: 1px solid #e5e7eb; border-top: 0; border-radius: 0 0 10px 10px; background: #f9fafb;
      box-shadow: 3px 0 8px -4px #37415159; transition: transform 300ms ease, visibility 300ms ease;
    }
    .collapsed .sidebar { transform: translateX(-100%); visibility: hidden; }
    .legajos-menu-list { margin: 0; padding: 12px 0 0; list-style: none; }
    .legajos-menu-entry { margin: 0; padding: 0; }
    .legajos-menu-item { font-weight: 500; }
    .legajos-menu-item-passive:hover { background: #f3f4f6; box-shadow: inset 6px 0 0 #bc9abb, inset 6px 0 6px #fff; }
    .legajos-menu-item-active { background: #f3f4f6; box-shadow: inset 6px 0 0 #793576, inset 6px 0 6px #fff; }
    .legajos-menu-button { display: block; width: 100%; min-height: 48px; padding: 12px 0 12px 20px; border: 0; background: transparent; color: #1f2937; font-size: 16px; text-align: left; transition: transform 300ms ease; }
    .legajos-menu-button:hover { transform: translateX(8px); }
    .sidebar-icon { display: inline-flex; width: 28px; height: 24px; align-items: center; justify-content: center; color: #71306e; vertical-align: middle; }
    .sidebar-icon > span { display: inline-flex; align-items: center; justify-content: center; }
    .sidebar-icon svg { width: 16px; height: 16px; fill: currentColor; }
    .persona-icon { color: #0f9f95; }
    .legajos-icon { color: #d4a017; }
    .rrhh-icon { color: #dc2626; }
    .mi-legajo-icon { color: #4f46e5; }
    .legajos-icon svg, .rrhh-icon svg, .mi-legajo-icon svg { width: 17px; height: 17px; }
    .legajo-view-switch { margin: 0 16px 8px 40px; padding: 0 0 0 8px; border-left: 1px solid #d8c5e5; }
    .sidebar-submenu-label { margin: 0 0 4px; padding: 8px 8px 0; color: #64748b; font-size: 12px; font-weight: 700; letter-spacing: .025em; }
    .legajo-view-switch button { display: flex; width: 100%; min-height: 40px; align-items: center; gap: 12px; margin: 0; padding: 8px 12px; border: 0; border-left: 4px solid transparent; background: transparent; color: #475569; font-size: 16px; text-align: left; transition: transform 300ms ease, background-color 150ms ease; }
    .legajo-view-switch button:hover { background: #f3f4f6; transform: translateX(8px); }
    .legajo-view-switch button.active { border-left-color: #5c2259; background: #f3f4f6; color: #5c2259; font-weight: 700; }
    .sidebar-demo-label { margin: 0; padding: 8px 12px; color: #64748b; font-size: 12px; font-weight: 600; }
    .restore-demo { position: absolute; right: 12px; bottom: 12px; left: 12px; padding: 8px; border: 1px solid #e2e8f0; border-radius: 5px; background: #fff; color: #64748b; font-size: 13px; }
    .restore-demo:hover { border-color: #d8c5e5; color: var(--purple-dark); }
    .side-note, .side-brand { position: absolute; right: 9px; left: 9px; padding: 9px; border: 1px solid #e2e8f0; border-radius: 6px; color: var(--muted); font-size: 13px; }
    .side-note { bottom: 60px; background: #f8fbff; }
    .side-brand { bottom: 10px; color: #6b21a8; }
    .side-brand small { display: block; margin-top: 3px; color: var(--muted); }
    .workspace { width: 100%; max-width: 1500px; min-width: 0; margin: 0 auto; padding: 12px; }
    .switcher { display: none; }
    .switcher-label { margin-right: 4px; font-weight: 700; }
    .switch-btn { padding: 7px 12px; border: 1px solid #e2e8f0; border-radius: 6px; background: white; color: #475569; }
    .switch-btn.active { border-color: var(--purple); background: var(--purple-soft); color: var(--purple-dark); font-weight: 700; }
    .sample-label { margin-left: auto; color: var(--green); font-weight: 700; }
    .reset-btn { margin-left: auto; border: 0; background: transparent; color: var(--muted); text-decoration: underline; }
    .sample-label + .reset-btn { margin-left: 0; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 12px 0; padding: 16px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; box-shadow: 0 4px 6px #0000001a; }
    .heading-copy { display: flex; flex: 1; align-items: center; gap: 12px; min-width: 0; }
    .heading-icon, .section-icon, .large-section-icon { display: grid; flex: 0 0 auto; place-items: center; border-radius: 7px; background: #f2eaf5; color: var(--purple-dark); font-weight: 700; }
    .heading-icon { width: 40px; height: 40px; font-size: 24px; }
    .eyebrow { margin: 0 0 3px; color: var(--purple-dark); font-size: 14px; font-weight: 700; letter-spacing: .04em; }
    h1 { margin: 0 0 3px; color: var(--ink); font-size: 24px; }
    h2, h3, p { margin-top: 0; }
    .description { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .notice { margin: 0 0 9px; padding: 8px 10px; border: 1px solid #ddd6e7; border-radius: 5px; background: var(--purple-soft); color: var(--purple-dark); font-size: 14px; line-height: 1.45; }
    .notice.blue { border-color: #bfdbfe; background: var(--blue-bg); color: var(--blue); }
    .notice.success { border-color: #bbf7d0; background: #f0fdf4; color: var(--green); }
    .card { min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: white; box-shadow: 0 4px 6px #0001; }
    .hr-grid { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); align-items: stretch; gap: 10px; min-width: 0; }
    .employee-list { padding: 10px; }
    .search-row { display: flex; align-items: center; gap: 7px; }
    .search-box { display: flex; flex: 1; align-items: center; gap: 7px; min-width: 0; padding: 0 9px; border: 1px solid #d7dce5; border-radius: 5px; color: var(--muted); }
    .search-box input { width: 100%; min-width: 0; height: 34px; border: 0; outline: 0; color: var(--text); }
    .search-symbol { font-size: 22px; }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 18px; font-size: 12px; white-space: nowrap; }
    .pill.green { background: var(--green-bg); color: var(--green); }
    .pill.amber { background: var(--amber-bg); color: var(--amber); }
    .pill.gray { background: #f1f5f9; color: #64748b; }
    .list-summary { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 7px; }
    .list-summary h2 { margin: 0; font-size: 17px; }
    .list-summary span { color: var(--muted); font-size: 13px; }
    .employee-pagination { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 9px 0 1px; color: var(--muted); font-size: 12px; }
    .employee-pagination button { padding: 5px 9px; border: 1px solid #e2e8f0; border-radius: 5px; background: #fff; color: #475569; font-size: 12px; }
    .employee-pagination button:hover:not(:disabled) { border-color: #d8c5e5; background: #faf7fc; color: var(--purple-dark); }
    .employee-pagination button:disabled { background: #f8fafc; color: #a0a9b8; cursor: not-allowed; }
    .hr-list-toolbar { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(140px, 190px) minmax(180px, 220px); align-items: center; gap: 9px; margin-bottom: 14px; }
    .hr-list-toolbar .search-box {
      min-height: 42px; padding: 0 12px; border: 2px solid #7c3ec8; border-radius: 9px;
      background: #f6f0ff; box-shadow: 0 3px 9px rgb(91 48 170 / 20%); color: #5627a8;
      transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease, transform 160ms ease;
    }
    .hr-list-toolbar .search-box:focus-within { transform: translateY(-1px); border-color: #5627a8; background: #fff; box-shadow: 0 0 0 4px rgb(107 53 197 / 19%), 0 4px 11px rgb(91 48 170 / 20%); }
    .hr-list-toolbar .search-box input { height: 38px; background: transparent; color: #243b63; }
    .hr-list-toolbar .search-box input::placeholder { color: #596f92; opacity: 1; }
    .hr-list-toolbar .hr-select-wrap select {
      width: 100%; min-height: 42px; padding: 6px 9px; border: 2px solid #4d73b8; border-radius: 9px;
      background: #edf4ff; color: #244b88; font-size: 13px; font-weight: 600; box-shadow: 0 3px 9px rgb(37 83 151 / 16%);
      transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease, transform 160ms ease;
    }
    .hr-list-toolbar .hr-select-wrap select:hover { border-color: #315fa8; background: #e4efff; }
    .hr-list-toolbar .hr-select-wrap select:focus-visible { border-color: #244b88; outline: 0; background: #fff; box-shadow: 0 0 0 4px rgb(49 95 168 / 16%), 0 3px 9px rgb(37 83 151 / 16%); }
    .page-size-select select { min-height: 28px; padding: 3px 6px; border: 1px solid #d7dce5; border-radius: 5px; background: #fff; color: #475569; font-size: 12px; }
    .employee-list-footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding-top: 9px; color: var(--muted); font-size: 12px; }
    .employee-list-footer .employee-pagination { padding: 0; }
    .employee-list-footer .employee-pagination { grid-column: 2; }
    .employee-list-footer .employee-pagination button.current-page { border-color: #d8c5e5; background: #faf7fc; color: var(--purple-dark); font-weight: 700; }
    .page-size-select { display: flex; grid-column: 3; align-items: center; justify-content: flex-end; gap: 5px; white-space: nowrap; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 8px 6px; background: #f6f8fc; color: #475569; font-size: 14px; font-weight: 700; white-space: nowrap; }
    td { padding: 8px 6px; border-bottom: 1px solid #edf0f4; color: #475569; font-size: 14px; line-height: 1.4; vertical-align: top; }
    .employee-table { min-width: 475px; }
    .hr-record-list { padding: 14px; border-color: #dce7f5; border-radius: 9px; }
    .hr-record-list .employee-table { overflow: hidden; border: 1px solid #e4ecf7; border-radius: 6px; }
    .hr-record-list .employee-table th { padding: 10px 12px; background: #f3f7fc; color: #334b70; font-size: 13px; }
    .hr-record-list .employee-table td { padding: 10px 12px; border-bottom-color: #e8eef6; color: #334b70; }
    .list-summary h2 { display: flex; align-items: center; gap: 8px; }
    .list-summary h2 svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .employee-table tr.selected { background: #f4eef8; }
    .hr-categories .section-icon { width: 34px; height: 34px; }
    .employee-select, .open-record { padding: 0; border: 0; background: none; color: #334155; cursor: pointer; font: inherit; text-align: left; }
    .employee-select:hover, .open-record:hover { color: #6b21a8; }
    .view-record-button {
      display: inline-flex; min-width: 82px; min-height: 28px; align-items: center; justify-content: center; gap: 6px;
      padding: 4px 8px; border: 1px solid #dfe8f5; border-radius: 6px; background: #f2f6fc; color: #385477;
      cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; white-space: nowrap;
      transition: border-color 150ms ease, background-color 150ms ease, color 150ms ease;
    }
    .view-record-button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .view-record-button:hover, .employee-table tr.selected .view-record-button { border-color: #d6c6f2; background: #f1ecff; color: #5627a8; }
    .hr-record-list .employee-table tbody tr:hover td, .hr-record-list .employee-table tr.selected td { background: #f5f0fb; }
    .open-record { font-size: 23px; }
    .open-record svg { width: 12px; height: 12px; fill: currentColor; }
    .empty { padding: 22px; color: var(--muted); text-align: center; }
    .person-card { overflow: hidden; padding: 11px; }
    .person-summary { display: flex; align-items: center; gap: 11px; padding: 14px; border-bottom: 1px solid #edf0f4; }
    .person-symbol { display: grid; width: 42px; height: 42px; flex: 0 0 42px; place-items: center; border-radius: 50%; background: #e0edff; color: #3975b9; }
    .person-symbol svg { width: 21px; height: 21px; fill: currentColor; }
    .person-heading { min-width: 0; flex: 1; }
    .person-heading h2 { margin: 0 0 4px; color: var(--ink); font-size: 16px; font-weight: 600; }
    .person-heading span { color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid #e2e8f0; }
    .tab { padding: 12px 10px 10px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #64748b; font-size: 13px; }
    .tab.active { border-bottom-color: var(--purple); color: var(--purple-dark); font-weight: 700; }
    .detail-content { padding: 12px; }
    .category-list { overflow: hidden; }
    .category-list-heading { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid #edf0f4; }
    .category-list-heading span { color: var(--muted); font-size: 13px; }
    .category-total { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 50%; background: #f2eaf5; color: var(--purple-dark) !important; font-weight: 700; }
    .category-item { display: flex; width: 100%; align-items: center; gap: 10px; padding: 11px 12px; border: 0; border-bottom: 1px solid #edf0f4; background: #fff; color: var(--text); text-align: left; }
    .category-item:hover { background: #faf7fc; }
    .category-item.active { background: #faf7fc; }
    .section-icon { width: 35px; height: 35px; font-size: 18px; }
    .section-icon svg, .large-section-icon svg, .heading-icon svg { width: 58%; height: 58%; fill: currentColor; }
    .hr-categories .category-item, .my-category-list .category-item {
      min-height: 76px; margin: 0 0 6px; padding: 9px; border: 1px solid #d5b8fa; border-radius: 7px;
      background: #e8d5ff; transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease, transform 150ms ease;
    }
    .hr-categories .category-item { margin: 0; }
    .hr-categories .category-item:hover, .my-category-list .category-item:hover,
    .hr-categories .category-item.active, .my-category-list .category-item.active {
      border-color: #bf9beb; background: #dfc5ff; box-shadow: inset 3px 0 0 #7e22ce, 0 2px 6px #64359a1a;

    .hr-categories .category-item:nth-of-type(6n + 2), .my-category-list .category-item:nth-of-type(6n + 2) { border-color: #a9caff; background: #d9e8ff; }
    .hr-categories .category-item:nth-of-type(6n + 3), .my-category-list .category-item:nth-of-type(6n + 3) { border-color: #8fd7bf; background: #ccefe4; }
    .hr-categories .category-item:nth-of-type(6n + 4), .my-category-list .category-item:nth-of-type(6n + 4) { border-color: #edbd7c; background: #ffe3bd; }
    .hr-categories .category-item:nth-of-type(6n + 5), .my-category-list .category-item:nth-of-type(6n + 5) { border-color: #efaec4; background: #ffdce6; }
    .hr-categories .category-item:nth-of-type(6n), .my-category-list .category-item:nth-of-type(6n) { border-color: #b3d59f; background: #dcefd3; }
    .hr-categories .category-item:nth-of-type(6n + 1), .my-category-list .category-item:nth-of-type(6n + 1) { border-color: #c4a8f5; background: #e5d5ff; }
    .hr-categories .category-item:nth-of-type(6n + 1):hover, .my-category-list .category-item:nth-of-type(6n + 1):hover,
    .hr-categories .category-item:nth-of-type(6n + 1).active, .my-category-list .category-item:nth-of-type(6n + 1).active { border-color: #b18be9; background: #dac3ff; box-shadow: inset 3px 0 0 #7e22ce, 0 2px 6px #64359a1a; }

    .hr-categories .category-item:nth-of-type(6n + 4).active, .my-category-list .category-item:nth-of-type(6n + 4).active { border-color: #f4ba70; background: #ffd69f; box-shadow: inset 3px 0 0 #d97706, 0 2px 6px #d977061a; }
    .hr-categories .category-item:nth-of-type(6n + 5):hover, .my-category-list .category-item:nth-of-type(6n + 5):hover,
    .hr-categories .category-item:nth-of-type(6n + 5).active, .my-category-list .category-item:nth-of-type(6n + 5).active { border-color: #f4a8c0; background: #ffc9d9; box-shadow: inset 3px 0 0 #db2777, 0 2px 6px #db27771a; }
    .hr-categories .category-item:nth-of-type(6n):hover, .my-category-list .category-item:nth-of-type(6n):hover,
    .hr-categories .category-item:nth-of-type(6n).active, .my-category-list .category-item:nth-of-type(6n).active { border-color: #add397; background: #cde7c0; box-shadow: inset 3px 0 0 #3f8e35, 0 2px 6px #3f8e351a; }
    .hr-categories .category-item:nth-of-type(6n + 2) .section-icon, .my-category-list .category-item:nth-of-type(6n + 2) .section-icon { background: #eaf2ff; color: #2563eb; }
    .hr-categories .category-item:nth-of-type(6n + 3) .section-icon, .my-category-list .category-item:nth-of-type(6n + 3) .section-icon { background: #e8faf5; color: #0f8a68; }

    .hr-categories .category-item:nth-of-type(6n + 5) .section-icon, .my-category-list .category-item:nth-of-type(6n + 5) .section-icon { background: #fff0f3; color: #db2777; }

      .hr-list-toolbar .search-box { grid-column: auto; }
      .hr-categories { grid-template-columns: minmax(0, 1fr); }
      .employee-list-footer { grid-template-columns: 1fr auto; }

    async function importEmployees(file) {
      if (!file) return;

        const people = validateEmployeeImport(JSON.parse(await file.text()));
        const previousState = state;
        const importedIds = new Set(people.map(person => person.id));
        const keepEmployeeData = records => Object.fromEntries(Object.entries(records).filter(([key]) => importedIds.has(Number(key.split("-")[0]))));
        state = {
          ...state,
          employees: people,
          selectedEmployeeId: importedIds.has(state.selectedEmployeeId) ? state.selectedEmployeeId : 1,
          documents: keepEmployeeData(state.documents),
          answers: keepEmployeeData(state.answers),
          submitted: keepEmployeeData(state.submitted),
          activeTab: "documents",
          showingSectionDocuments: false
        };
        if (!saveState()) { state = previousState; return; }
        personalDraft = null;
        personalMessage = "";
        searchTerm = "";
        employeePage = 1;
        render();
        showToast("Se importaron los datos de trabajadores. Los adjuntos locales de registros omitidos se quitaron.");
      } catch (error) {
        console.error("No se pudieron importar los datos de trabajadores.", error);
        showToast(error instanceof SyntaxError ? "El archivo no contiene un JSON válido." : error.message || "No se pudo importar el archivo.", true);
      } finally {
        importDataFile.value = "";
      }

    function sectionStatus(section) {
      const required = section.documents.map((text, index) => ({ text, index }))
        .filter(item => !isDeclaration(item.text) || state.answers[docKey(section.id, item.index)] === "Sí")
        .filter(item => state.mode === "hr" || canUpload(section, item.index, "employee"));
      const uploaded = required.filter(item => Boolean(getDocument(docKey(section.id, item.index)))).length;

    function progressCount() {
      let total = 0, completed = 0;
      sections.forEach(section => section.documents.forEach((text, index) => {
        if (canUpload(section, index, "employee") && !isDeclaration(text)) {
          total++;
          const item = getDocument(docKey(section.id, index));
          if (item) completed++;
        }
      }));
      return { total, completed };
    }
    function progressByOwner() {
      const progress = { hr: { total: 0, completed: 0 }, employee: { total: 0, completed: 0 } };

        if (isDeclaration(text)) return;
        const owner = hrOnly(section, index) ? "hr" : "employee";

      }));

    }

    function renderHeading() {
      if (state.mode === "hr") return `<header class="heading"><div class="heading-copy">${iconMarkup("faFolderOpen", "heading-icon")}<div><p class="eyebrow">GESTIÓN DE PERSONAL</p><h1>Legajos</h1><p class="description">Consulta y administra la documentación del personal activo.</p></div></div></header>
        <div class="notice">Vista de demostración: el listado contiene datos ficticios y los archivos seleccionados no se guardan en el servidor.</div>`;
      const progress = progressCount();
      const pct = progress.total ? Math.round(progress.completed / progress.total * 100) : 0;
      return `<header class="heading"><div class="heading-copy">${iconMarkup("faAddressCard", "heading-icon")}<div><p class="eyebrow">GESTIÓN DE PERSONAL / LEGAJO</p><h1>Mi legajo</h1><p class="description">Completa tus datos y organiza los documentos solicitados por Recursos Humanos.</p></div></div>
        <div class="progress-card" aria-label="Progreso de Mi legajo"><small>Documentos adjuntos</small><strong>${progress.completed} <span>de ${progress.total}</span></strong><div class="progress-track" role="progressbar" aria-valuenow="${progress.completed}" aria-valuemax="${progress.total}" aria-label="Documentos adjuntos"><span style="width:${pct}%"></span></div></div></header>
        <div class="notice">Prototipo: los datos personales guardados quedan disponibles en la vista de RR. HH. en este navegador. Los archivos adjuntos se guardan localmente y no se envían al servidor.</div>
        <div class="notice blue employee-access-note">Los documentos identificados como “solo RR. HH.” son gestionados por Recursos Humanos. Puedes consultar los archivos registrados, pero no adjuntarlos ni modificarlos.</div>`;
    }
    function renderEmployeeTable() {
      const query = searchTerm.trim().toLocaleLowerCase();
      const matches = state.employees.filter(person => (employeeStatusFilter === "all" || person.status === "Activo") &&
        (!query || person.personalData.fullName.toLocaleLowerCase().includes(query) || person.personalData.dni.includes(query)));
      matches.sort((left, right) => {
        if (employeeSortOrder === "dni") return left.personalData.dni.localeCompare(right.personalData.dni);
        if (employeeSortOrder === "name") return left.personalData.fullName.localeCompare(right.personalData.fullName, "es");
        return left.id - right.id;
      });
      const totalPages = Math.max(1, Math.ceil(matches.length / employeePageSize));
      employeePage = Math.min(employeePage, totalPages);
      const start = (employeePage - 1) * employeePageSize;
      const visiblePeople = matches.slice(start, start + employeePageSize);
      const firstPerson = matches.length ? start + 1 : 0;
      const lastPerson = Math.min(start + employeePageSize, matches.length);
      const pages = Array.from({ length: totalPages }, (_, index) => index + 1);
      return `<section class="card employee-list hr-record-list"><div class="hr-list-toolbar"><label class="search-box"><span class="search-symbol" aria-hidden="true">${iconMarkup("faMagnifyingGlass")}</span><input id="employee-search" type="search" value="${esc(searchTerm)}" placeholder="Buscar por N.° de documento o nombre..." aria-label="Buscar por número de documento o nombre"></label>
        <label class="hr-select-wrap"><span class="sr-only">Filtrar por estado</span><select data-employee-status aria-label="Filtrar por estado"><option value="all" ${employeeStatusFilter === "all" ? "selected" : ""}>Estado: Todos</option><option value="active" ${employeeStatusFilter === "active" ? "selected" : ""}>Estado: Activo</option></select></label>
        <label class="hr-select-wrap"><span class="sr-only">Ordenar personal</span><select data-employee-sort aria-label="Ordenar personal"><option value="default" ${employeeSortOrder === "default" ? "selected" : ""}>Ordenar: Predeterminado</option><option value="dni" ${employeeSortOrder === "dni" ? "selected" : ""}>Ordenar por: N.° documento</option><option value="name" ${employeeSortOrder === "name" ? "selected" : ""}>Ordenar por: Nombre</option></select></label></div>
        <div class="list-summary"><h2 id="employee-list-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2m5-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm13 10v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Personal activo</h2><span>${matches.length} registros</span></div><div class="table-wrap"><table class="employee-table" aria-labelledby="employee-list-heading"><thead><tr><th>N.° documento</th><th>Nombres y apellidos</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
        ${matches.length ? visiblePeople.map(person => `<tr class="${person.id === activeEmployee().id ? "selected" : ""}"><td>${esc(person.personalData.dni)}</td><td><button class="employee-select" type="button" data-action="select-employee" data-id="${person.id}" aria-pressed="${person.id === activeEmployee().id}">${esc(person.personalData.fullName)}</button></td><td><span class="pill green">${esc(person.status)}</span></td><td><button class="view-record-button" type="button" data-action="select-employee" data-id="${person.id}" aria-label="Ver legajo de ${esc(person.personalData.fullName)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.2-6 9.5-6 9.5 6 9.5 6-3.2 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg><span>Ver legajo</span></button></td></tr>`).join("") : `<tr><td class="empty" colspan="4">No se encontraron personas activas con esa búsqueda.</td></tr>`}
        </tbody></table></div><footer class="employee-list-footer"><span>Mostrando ${firstPerson}–${lastPerson} de ${matches.length}</span><nav class="employee-pagination" aria-label="Paginación del personal"><button type="button" data-action="employee-page" data-page="${employeePage - 1}" ${employeePage === 1 ? "disabled" : ""} aria-label="Página anterior">«</button>${pages.map(page => `<button type="button" data-action="employee-page" data-page="${page}" class="${employeePage === page ? "current-page" : ""}" ${employeePage === page ? 'aria-current="page"' : ""}>${page}</button>`).join("")}<button type="button" data-action="employee-page" data-page="${employeePage + 1}" ${employeePage === totalPages ? "disabled" : ""} aria-label="Página siguiente">»</button></nav><label class="page-size-select">Filas por página:<select data-employee-page-size aria-label="Filas por página"><option value="5" ${employeePageSize === 5 ? "selected" : ""}>5</option><option value="10" ${employeePageSize === 10 ? "selected" : ""}>10</option><option value="15" ${employeePageSize === 15 ? "selected" : ""}>15</option></select></label></footer></section>`;
    }
    function renderHrDetails() {
      const person = activeEmployee();
      return `<section class="card person-card" aria-label="Detalle del legajo seleccionado"><button type="button" class="back-to-sections hr-back-to-list" data-action="back-list">‹ Volver al listado</button><header class="person-summary"><span class="person-symbol" aria-hidden="true">${iconMarkup("faUser")}</span><div class="person-heading"><h2>${esc(person.personalData.fullName)}</h2><span>DNI: ${esc(person.personalData.dni)}</span></div><span class="pill green">${esc(person.status)}</span></header>
        <div class="tabs" role="tablist" aria-label="Información del legajo"><button class="tab ${state.activeTab === "documents" ? "active" : ""}" type="button" role="tab" aria-selected="${state.activeTab === "documents"}" data-action="tab" data-tab="documents">Documentos del legajo</button><button class="tab ${state.activeTab === "personal" ? "active" : ""}" type="button" role="tab" aria-selected="${state.activeTab === "personal"}" data-action="tab" data-tab="personal">Datos personales</button></div>
        <div class="detail-content">${state.activeTab === "personal" ? renderHrPersonal(person) : state.showingSectionDocuments ? renderHrSection() : `${renderHrProgressCards()}${renderCategories(true)}`}</div></section>`;
    }
    function renderHrProgressCards() {
      const progress = progressByOwner();
      const card = (key, label) => {
        const owner = progress[key];
        const percent = owner.total ? owner.completed / owner.total * 100 : 0;
        return `<div class="progress-card" aria-label="Progreso de documentos a cargo de ${label}"><span class="progress-label">A cargo de ${label}</span><strong>${owner.completed} <span>de ${owner.total}</span></strong><div class="progress-track" role="progressbar" aria-valuenow="${owner.completed}" aria-valuemax="${owner.total}" aria-label="Documentos de ${label} cargados"><span style="width:${percent}%"></span></div></div>`;
      };
      return `<div class="document-progress-cards hr-document-progress" aria-label="Progreso de documentos del legajo">${card("hr", "RR. HH.")}${card("employee", "personal")}</div>`;
    }
    function renderCategories(hr = false) {
      const collapsedAttributes = !hr ? ` id="my-category-list" aria-hidden="${state.sectionsPanelCollapsed}" ${state.sectionsPanelCollapsed ? "inert" : ""}` : "";
      return `<nav class="category-list ${hr ? "hr-categories" : "my-category-list"}" aria-label="Categorías del legajo"${collapsedAttributes}>${hr ? "" : `<div class="category-list-heading"><div><p class="eyebrow">MI LEGAJO</p><span>Documentación por sección</span></div><span class="category-total">${sections.length} secciones</span></div>`}
        ${sections.map(section => `<button class="category-item ${!hr && section.id === state.selectedSection ? "active" : ""}" type="button" data-action="select-section" data-id="${section.id}">${iconMarkup(section.icon, "section-icon")}<span class="category-copy"><strong>${hr ? `${section.id}.` : `${String(section.id).padStart(2, "0")}.`} ${esc(section.title)}</strong><small class="category-description">${esc(section.description)}</small><small class="section-status status-${sectionStatus(section) === "Pendiente" ? "pending" : "complete"}">${sectionStatus(section)}</small></span><span class="section-chevron" aria-hidden="true">${iconMarkup("faChevronRight")}</span></button>`).join("")}</nav>`;
    }
    function sectionHead(section, isHr = false) {
      return `<header class="section-heading">${iconMarkup(section.icon, "large-section-icon")}<div><p class="eyebrow">SECCIÓN ${String(section.id).padStart(2, "0")} DE ${sections.length}</p><h2>${esc(section.title)}</h2>${isHr ? "" : `<p class="description">${esc(section.description)}</p>`}</div></header>`;
    }
    function subsectionRows(section, index, colspan = 5) {
      return (section.subsections || []).filter(subsection => subsection.index === index).map(subsection => `<tr class="subsection-row"><td colspan="${colspan}">${esc(subsection.title)}</td></tr>`).join("");
    }
    function renderHrSection() {
      const section = activeSection(), person = activeEmployee();
      return `<button type="button" class="back-to-sections hr-back-to-record" data-action="back-sections">‹ Volver al legajo</button>
        <div class="notice ${isSubmitted(person.id, section.id) ? "success" : ""}">${isSubmitted(person.id, section.id) ? "El personal envió esta sección. Ya puedes revisar los documentos adjuntos." : "Los documentos del personal estarán disponibles cuando envíe esta sección."}</div>
        ${sectionHead(section, true)}<div class="table-wrap"><table class="doc-table hr-document-table"><thead><tr><th>Tipo de documento</th><th>Acciones</th><th>Estado</th><th>Nombre del archivo</th><th>Fecha de registro</th></tr></thead><tbody>
        ${section.documents.map((text, index) => {
          const key = docKey(section.id, index), file = getDocument(key), visible = Boolean(file);
          const actions = visible ? `<div class="file-actions">${file.owner === "hr" ? `<button class="remove-attachment-button" type="button" data-action="remove-file" data-key="${esc(key)}" aria-label="Quitar archivo de Recursos Humanos" title="Quitar documento">${removeAttachmentIcon()}</button>` : ""}${filePreviewButton(file, key, "Visualizar") }<a class="action-link table-download" href="${esc(file.data)}" download="${esc(file.name)}">Descargar</a>${canUpload(section, index, "hr") ? uploadControl(section, index, "hr", "Cambiar") : ""}</div>` : canUpload(section, index, "hr") ? uploadControl(section, index, "hr", "+ Cargar") : `<span class="readonly">Sin documento adjunto</span>`;
          return subsectionRows(section, index) + `<tr><td><span class="document-copy"><strong>${esc(text)}</strong><small class="owner-label">${esc(documentOwner(section, index))}</small></span></td><td>${actions}</td><td><span class="pill ${visible ? "green" : "amber"}">${visible ? "Vigente" : "Pendiente"}</span></td><td class="file-name">${visible ? fileNameButton(file, key) : "—"}</td><td class="file-date">${visible ? new Date(file.registeredAt).toLocaleDateString("es-PE") : "—"}</td></tr>`;
        }).join("")}</tbody></table></div><p class="table-note">Los archivos de la vista RR. HH. se simulan localmente; no se transmiten al backend.</p>`;
    }
    function uploadControl(section, index, uploader, label) {
      const accept = ".pdf,.jpg,.jpeg,.png,.doc,.docx";
      return `<label class="upload-button hr-upload-button" title="${label}"><input type="file" accept="${accept}" data-upload-section="${section.id}" data-upload-index="${index}" data-uploader="${uploader}" aria-label="${label} ${esc(section.documents[index])}">${label}</label>`;
    }
    function filePreviewButton(file, key, label = "Ver archivo adjunto", showText = false) {
      return `<button class="preview-attachment-button table-view table-view-icon" type="button" data-action="view-file" data-key="${esc(key)}" title="${esc(label)}" aria-label="${esc(label)}: ${esc(file.name)}">${previewAttachmentIcon()}${showText ? "<span>Ver</span>" : ""}</button>`;
    }
    function fileNameButton(file, key) {
      return `<button class="file-name-preview" type="button" data-action="view-file" data-key="${esc(key)}">${esc(file.name)}</button>`;
    }
    function renderHrPersonal(person) {
      const data = person.personalData;
      return `<section class="personal-data hr-personal-data"><p class="eyebrow">INFORMACIÓN SOLICITADA EN EL LEGAJO</p><h3>Datos del/de la servidor/a civil</h3>${renderReadOnlyGroup("identification", "Identificación", "Datos básicos de identificación del/de la servidor/a civil.", [["Nombres y apellidos", data.fullName], ["DNI", data.dni]])}${renderReadOnlyGroup("contact", "Contacto", "Medios de comunicación del/de la servidor/a civil.", [["N.° de celular", data.phone], ["Correo electrónico", data.email]])}${renderReadOnlyGroup("address", "Domicilio", "Dirección actual del/de la servidor/a civil.", [["Domicilio actual", data.address]])}</section>`;
    }

      const section = sections.find(item => item.id === sectionId);

      if (!allowed.includes(extension)) { uploadMessage = "Formato no permitido. Selecciona un archivo PDF, JPG, PNG, DOC o DOCX."; render(); return; }

      documentViewerUrl = null;
    });
    loadState();
    render();
    if (location.protocol === "file:") {
      try { localStorage.setItem(`${STORAGE_KEY}-probe`, "ok"); localStorage.removeItem(`${STORAGE_KEY}-probe`); }
      catch (error) { console.error("Este navegador bloqueó localStorage para el archivo local.", error); showToast("Este navegador bloquea el almacenamiento local para archivos HTML. Prueba habilitarlo en la configuración del navegador.", true); }
    }
  </script>
</body>
</html>
