<!--
  Modal reutilizable para confirmaciones y formularios.
  - Controla visibilidad con isOpen.
  - Permite cerrar con click fuera o botón.
  - Incluye cabecera, contenido dinámico y acciones.
-->
<div [ngClass]="isOpen ? 'block' : 'hidden'"
        class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-30 z-50 overflow-y-auto overflow-x-auto"
        (click)="onCancel()">

    <div class="bg-white rounded-md shadow-xl relative max-h-full top-4" (click)="closeOut($event)">
        <button (click)="btnClose()"
            class="absolute top-0 right-0 -mt-3 -mr-3 bg-red-400 hover:bg-red-500 text-white border shadow-[-1px_1px_2px_2px_rgba(174,128,128,0.85)] font-bold p-0.5 border-red-500 rounded-full text-lg disabledxSave">
            <fa-icon [icon]="faXmark" class="block w-7 h-7"></fa-icon>
        </button>

        <!-- modal cabecera -->
        <div class="{{colorBgTitle}} w-auto rounded-t-md text-white font-medium text-center p-2">
            {{ title }}
        </div>
        <!-- modal contenido -->
        <div class="bg-white w-auto h-auto p-6 text-center rounded-md text-gray-600 font-medium">
            <ng-content></ng-content>
        </div>
    </div>
</div>
